name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20
      - run: bun install --frozen-lockfile
      - name: Format
        run: bun run fmt
      - name: Biome check
        run: bun run check
      - name: TypeScript
        run: bun run typecheck
      - name: Tests (src)
        run: bun test ./src
      - name: Webapp install
        working-directory: webapp
        run: bun install --frozen-lockfile
      - name: Webapp check
        working-directory: webapp
        run: bun run check
      - name: Webapp tests
        working-directory: webapp
        run: bun run test
      - name: Webapp build
        working-directory: webapp
        run: bun run build
